services:
  redis:
    image: redis:7-alpine
    container_name: checker-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: checker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-checker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-checker}
      POSTGRES_DB: ${POSTGRES_DB:-checker}
    ports:
      - "${POSTGRES_PORT_HOST:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-checker} -d ${POSTGRES_DB:-checker}"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: .
    container_name: checker-worker
    restart: unless-stopped
    command: celery -A app.celery_app:celery_app worker --loglevel=info
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  beat:
    build: .
    container_name: checker-beat
    restart: unless-stopped
    command: celery -A app.celery_app:celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started

volumes:
  pgdata:
