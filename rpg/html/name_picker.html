<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCCC Name Picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Sans:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --lapis:#162047;
  --lapis-2:#1d2a5a;
  --lapis-3:#283770;
  --silver:#e6e4ee;
  --silver-dim:#a9acc6;
  --gold:#cfa84a;
  --gold-soft:#8f7637;
  --vermilion:#c8402f;
  --verdigris:#4f9a7c;
  --serif:"EB Garamond",Garamond,Georgia,"Times New Roman",serif;
  --ipa:"Noto Sans","Segoe UI","DejaVu Sans","Lucida Grande",sans-serif;
}
*{box-sizing:border-box}
html{background:var(--lapis)}
body{margin:0;background:var(--lapis);color:var(--silver);font-family:var(--serif);font-size:19px;line-height:1.5;min-height:100vh}
.stripes{height:10px;background:repeating-linear-gradient(90deg,var(--vermilion) 0 48px,#d8d6e0 48px 96px)}
.wrap{max-width:1180px;margin:0 auto;padding:28px 24px 64px}
header h1{font-weight:500;font-size:2.1rem;letter-spacing:.01em;margin:0 0 4px}
header p{margin:0;color:var(--silver-dim);font-style:italic}

.controls{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:16px 20px;align-items:flex-end;margin:28px 0 30px;padding:18px 20px;background:var(--lapis-2);border:1px solid var(--gold-soft);border-radius:0 0 3px 3px;box-shadow:0 10px 18px -12px rgba(5,9,30,.9)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.9rem;color:var(--silver-dim)}
select,input[type=search]{font:inherit;font-size:1.05rem;color:var(--silver);background:var(--lapis);border:1px solid var(--lapis-3);border-radius:2px;padding:8px 12px;min-height:44px}
select{min-width:150px;cursor:pointer}
#culture{min-width:min(390px,80vw)}
input[type=search]{min-width:200px}
select:hover,input[type=search]:hover{border-color:var(--gold-soft)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pick{font:inherit;font-size:1.1rem;font-weight:600;color:#fff;background:var(--vermilion);border:1px solid #e0705f;border-radius:2px;padding:9px 22px;min-height:44px;cursor:pointer;margin-left:auto}
.pick:hover{background:#d44b39}
.pick:active{transform:translateY(1px)}

.layout{display:grid;grid-template-columns:minmax(300px,410px) 1fr;gap:36px;align-items:start}
.folio{position:sticky;top:calc(var(--ctrl-h,0px) + 20px);background:var(--lapis-2);border:1px solid var(--gold-soft);border-radius:3px;padding:28px 28px 26px;min-height:300px}
.folio .empty{color:var(--silver-dim);font-style:italic;margin:0}
.chosen{display:flex;align-items:flex-start;gap:14px}
.initial{flex:none;width:86px;height:92px;display:grid;place-items:center;background:var(--lapis);border:3px double var(--gold);color:var(--vermilion);font-size:4.4rem;line-height:1;font-weight:600;padding-bottom:6px;text-shadow:0 0 1px rgba(0,0,0,.4)}
.rest{font-size:2.6rem;line-height:1.05;font-weight:500;padding-top:22px;word-break:break-word}
.folio .ipa{font-family:var(--ipa);font-size:1rem;color:var(--silver);margin:18px 0 4px}
.folio .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0 16px;color:var(--silver-dim);font-size:.95rem}
.folio .meaning{margin:0;font-size:1.12rem;line-height:1.55;border-top:1px solid var(--lapis-3);padding-top:14px}
.folio .alias{margin:8px 0 0;color:var(--silver-dim);font-size:.95rem;font-style:italic}

.tag{display:inline-block;font-size:.8rem;line-height:1;padding:4px 7px 5px;border-radius:2px;border:1px solid;white-space:nowrap;font-family:var(--serif)}
.tag.T{color:#f0a294;border-color:#9c3a2e}
.tag.C{color:var(--gold);border-color:var(--gold-soft)}
.tag.I{color:#8fd2b6;border-color:#3f7d65}
.tag.H{color:#b9c6f5;border-color:#5a6aa8}

.listhead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.listhead h2{margin:0;font-weight:500;font-size:1.45rem}
.count{color:var(--silver-dim)}
.legend .note{margin-right:14px}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px;color:var(--silver-dim);font-size:.9rem;align-items:center}
.letters{display:flex;flex-wrap:wrap;gap:2px;margin:0 0 18px}
.letters a{color:var(--gold);text-decoration:none;padding:2px 7px;border-radius:2px;font-size:1rem}
.letters a:hover{background:var(--lapis-3)}
.group{margin:0 0 18px;scroll-margin-top:calc(var(--ctrl-h,0px) + 16px)}
.names li{scroll-margin-top:calc(var(--ctrl-h,0px) + 16px);scroll-margin-bottom:16px}
#tip{position:fixed;z-index:40;max-width:340px;padding:10px 13px 11px;background:#0e1534;color:var(--silver);border:1px solid var(--gold-soft);border-radius:3px;font-size:.98rem;line-height:1.45;pointer-events:none;box-shadow:0 8px 22px rgba(0,0,0,.45);opacity:0;transition:opacity .12s}
#tip.on{opacity:1}
#tip b{display:block;font-weight:600;color:var(--gold);margin-bottom:2px}
mark{background:rgba(207,168,74,.28);color:inherit;border-radius:2px}
.group h3{margin:0 0 6px;color:var(--vermilion);font-weight:600;font-size:1.7rem;line-height:1;border-bottom:1px solid var(--lapis-3);padding-bottom:4px}
.names{list-style:none;margin:0;padding:0;columns:2 290px;column-gap:28px}
.names li{break-inside:avoid}
.names button{all:unset;box-sizing:border-box;display:flex;align-items:baseline;gap:8px;width:100%;padding:4px 8px;border-radius:2px;cursor:pointer;flex-wrap:wrap}
.names button:hover{background:var(--lapis-2)}
.names button:focus-visible{outline:2px solid var(--gold);outline-offset:0}
.names button.on{background:var(--lapis-3);box-shadow:inset 3px 0 0 var(--vermilion)}
.names .n{font-size:1.08rem}
.names .i{font-family:var(--ipa);font-size:.8rem;color:var(--silver-dim)}
.names .tag{margin-left:auto;font-size:.72rem;padding:3px 5px 4px}
.none{color:var(--silver-dim);font-style:italic}

.rolling .rest,.rolling .initial{opacity:.55}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .folio{position:static}
  .pick{margin-left:0;width:100%}
  .rest{font-size:2.1rem}
}
@media (max-width:480px){
  .wrap{padding:20px 16px 48px}
  .controls{display:grid;grid-template-columns:7.5em 1fr;gap:8px 10px;padding:10px 12px;margin:20px -16px 22px;border-left:0;border-right:0}
  .controls .field label{font-size:.8rem}
  select,#culture,input[type=search]{width:100%;min-width:0;font-size:1rem;padding:6px 8px;min-height:40px}
  .controls .field:nth-child(3){grid-column:1/-1}
  .pick{grid-column:1/-1;min-height:42px;padding:6px 16px}
  .initial{width:70px;height:76px;font-size:3.5rem}
  .rest{padding-top:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="stripes" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <h1>Names of the Carpathian realms</h1>
    <p>Choose a sex and a culture to see every name, or draw one at random.</p>
  </header>

  <form class="controls" onsubmit="return false">
    <div class="field">
      <label for="sex">Sex</label>
      <select id="sex">
        <option value="M">Male</option>
        <option value="F">Female</option>
      </select>
    </div>
    <div class="field">
      <label for="culture">Culture</label>
      <select id="culture"></select>
    </div>
    <div class="field">
      <label for="filter">Search names, IPA or meanings</label>
      <input id="filter" type="search" placeholder="e.g. Péter, ʃ, wolf" autocomplete="off">
    </div>
    <button type="button" class="pick" id="pick">Pick a random name</button>
  </form>

  <div class="layout">
    <aside class="folio" id="folio" aria-live="polite">
      <p class="empty">Press “Pick a random name”, or choose any name from the list.</p>
    </aside>
    <section aria-labelledby="listtitle">
      <div class="listhead">
        <h2 id="listtitle">Names</h2>
        <span class="count" id="count"></span>
      </div>
      <div class="legend" id="legend"></div>
      <nav class="letters" id="letters" aria-label="Jump to letter"></nav>
      <div id="list"></div>
    </section>
  </div>
</div>

<script>
const DATA = [{"label":"Magyars","M":[{"n":"Ábel","t":"C","i":"/ˈaːbɛl/","m":"Hebrew Hevel 'breath, vapour'; son of Adam"},{"n":"Ábrahám","t":"C","i":"/ˈaːbrɒhaːm/","m":"Hebrew 'father of multitudes'; the patriarch"},{"n":"Adorján","t":"C","i":"/ˈɒdorjaːn/","m":"Latin Hadrianus 'from Hadria'"},{"n":"Ágoston","t":"C","i":"/ˈaːgoʃton/","m":"Latin Augustinus 'venerable'; St Augustine"},{"n":"Ákos","t":"T","i":"/ˈaːkoʃ/","m":"Turkic aq 'white' (or 'white falcon'); Árpád-era clan name"},{"n":"Aladár","t":"T","i":"/ˈɒlɒdaːr/","m":"Perhaps Turkic alad 'chieftain' or Germanic Aldarich; in the Hun legend a son of Attila"},{"n":"Álmos","t":"T","i":"/ˈaːlmoʃ/","m":"Old Hungarian álom 'dream' (his mother Emese's dream of the Turul); father of Árpád"},{"n":"Ambrus","t":"C","i":"/ˈɒmbruʃ/","m":"Greek ambrosios 'immortal'; St Ambrose of Milan"},{"n":"Andor","t":"C","i":"/ˈɒndor/","m":"Hungarian form of Andrew: Greek 'manly'"},{"n":"András","t":"C","i":"/ˈɒndraːʃ/","m":"Greek andreios 'manly, brave'; the Apostle Andrew"},{"n":"Antal","t":"C","i":"/ˈɒntɒl/","m":"Latin Antonius, Roman family name; St Anthony"},{"n":"Attila","t":"T","i":"/ˈɒtːilɒ/","m":"Gothic 'little father'; king of the Huns, claimed ancestor of the Árpáds"},{"n":"Balázs","t":"C","i":"/ˈbɒlaːʒ/","m":"Latin Blasius, perhaps 'lisping'; St Blaise"},{"n":"Bálint","t":"C","i":"/ˈbaːlint/","m":"Latin valens 'strong, healthy'; St Valentine"},{"n":"Barnabás","t":"C","i":"/ˈbɒrnɒbaːʃ/","m":"Aramaic 'son of consolation'; the Apostle Barnabas"},{"n":"Bartal","t":"C","i":"/ˈbɒrtɒl/","m":"Old Hungarian form of Bartholomew: Aramaic 'son of Talmai'"},{"n":"Béla","t":"T","i":"/ˈbeːlɒ/","m":"Perhaps Old Hungarian bél 'entrails, heart' or Slavic belŭ 'white'; royal name of the Árpáds"},{"n":"Bence","t":"C","i":"/ˈbɛntsɛ/","m":"Hungarian short form of Vincent: Latin 'conquering'"},{"n":"Benedek","t":"C","i":"/ˈbɛnɛdɛk/","m":"Latin benedictus 'blessed'; St Benedict of Nursia"},{"n":"Bertalan","t":"C","i":"/ˈbɛrtɒlɒn/","m":"Aramaic 'son of Talmai'; the Apostle Bartholomew"},{"n":"Bertók","t":"C","i":"/ˈbɛrtoːk/","m":"Old Hungarian diminutive of Bertalan (Bartholomew)"},{"n":"Boldizsár","t":"C","i":"/ˈboldiʒaːr/","m":"Hungarian Balthazar, one of the Three Magi: 'Baal protect the king'"},{"n":"Bors","t":"T","i":"/ˈborʃ/","m":"Turkic bars 'leopard, panther'; Árpád-era name"},{"n":"Botond","t":"T","i":"/ˈbotond/","m":"Old Hungarian bot 'club, mace'; legendary champion at Constantinople"},{"n":"Csaba","t":"T","i":"/ˈtʃɒbɒ/","m":"Turkic čaba 'gift, shepherd'; in legend the youngest son of Attila and ancestor of the Székely"},{"n":"Csongor","t":"T","i":"/ˈtʃongor/","m":"Turkic šongqar 'gyrfalcon'"},{"n":"Dániel","t":"C","i":"/ˈdaːniɛl/","m":"Hebrew 'God is my judge'; the Prophet Daniel"},{"n":"Dávid","t":"C","i":"/ˈdaːvid/","m":"Hebrew 'beloved'; King David"},{"n":"Demeter","t":"C","i":"/ˈdɛmɛtɛr/","m":"Greek 'of Demeter'; St Demetrius of Thessalonica"},{"n":"Dénes","t":"C","i":"/ˈdeːnɛʃ/","m":"Greek 'of Dionysus'; St Denis"},{"n":"Dezső","t":"C","i":"/ˈdɛʒøː/","m":"Old Hungarian form of Desiderius: Latin 'longing, desired'"},{"n":"Domokos","t":"C","i":"/ˈdomokoʃ/","m":"Latin dominicus 'of the Lord'"},{"n":"Domonkos","t":"C","i":"/ˈdomonkoʃ/","m":"Latin dominicus 'of the Lord'"},{"n":"Donát","t":"C","i":"/ˈdonaːt/","m":"Latin Donatus 'given (by God)'"},{"n":"Dömötör","t":"C","i":"/ˈdømøtør/","m":"Greek 'of Demeter'; St Demetrius of Thessalonica"},{"n":"Edvárd","t":"C","i":"/ˈɛdvaːrd/","m":"Old English ead 'wealth' + weard 'guardian'"},{"n":"Egyed","t":"C","i":"/ˈɛɟɛd/","m":"Greek aigidion 'young goat'; St Giles (Egidius)"},{"n":"Elek","t":"C","i":"/ˈɛlɛk/","m":"Greek alexios 'defender, helper'"},{"n":"Elemér","t":"T","i":"/ˈɛlɛmeːr/","m":"Perhaps Germanic Elmar 'noble-famous'; revived as a Hungarian name"},{"n":"Előd","t":"T","i":"/ˈɛløːd/","m":"Old Hungarian 'ancestor, forefather'; one of the seven Magyar chieftains"},{"n":"Emil","t":"C","i":"/ˈɛmil/","m":"Latin Aemilius 'rival, eager'"},{"n":"Endre","t":"C","i":"/ˈɛndrɛ/","m":"Hungarian form of Andrew: Greek 'manly'; Andrew I and II of Hungary"},{"n":"Ernő","t":"C","i":"/ˈɛrnøː/","m":"Hungarian form of Ernest: Germanic 'earnest, vigour'"},{"n":"Etele","t":"T","i":"/ˈɛtɛlɛ/","m":"Hungarian form of Attila: Gothic 'little father'"},{"n":"Fábián","t":"C","i":"/ˈfaːbiaːn/","m":"Latin Fabianus, Roman family name; Pope St Fabian"},{"n":"Farkas","t":"T","i":"/ˈfɒrkɒʃ/","m":"Hungarian 'wolf'"},{"n":"Ferenc","t":"C","i":"/ˈfɛrɛnts/","m":"Latin 'the Frenchman'; St Francis of Assisi"},{"n":"Flórián","t":"C","i":"/ˈfloːriaːn/","m":"Latin florus 'flowering'; St Florian, protector against fire"},{"n":"Fülöp","t":"C","i":"/ˈfyløp/","m":"Greek 'lover of horses'; the Apostle Philip"},{"n":"Gábor","t":"C","i":"/ˈgaːbor/","m":"Hebrew 'God is my strength'; the Archangel"},{"n":"Gál","t":"C","i":"/ˈgaːl/","m":"Latin Gallus 'Gaul' or 'rooster'; St Gall"},{"n":"Gáspár","t":"C","i":"/ˈgaːʃpaːr/","m":"Caspar, one of the Three Magi: Persian 'treasurer'"},{"n":"Gellért","t":"C","i":"/ˈgɛlːeːrt/","m":"Germanic ger 'spear' + hard 'brave'; St Gerard (Gellért) of Csanád"},{"n":"Géza","t":"T","i":"/ˈgeːzɒ/","m":"Turkic 'prince, ruler' (Old Hungarian Géjza); father of St Stephen"},{"n":"Gergely","t":"C","i":"/ˈgɛrgɛj/","m":"Greek grēgorios 'watchful'"},{"n":"György","t":"C","i":"/ˈɟørɟ/","m":"Greek geōrgos 'farmer'; St George the dragon-slayer"},{"n":"Gyula","t":"T","i":"/ˈɟulɒ/","m":"Old Hungarian dignity 'gyula', second-highest rank of the tribal state"},{"n":"Hunor","t":"T","i":"/ˈhunor/","m":"Legendary forefather of the Huns; brother of Magor, son of Ménrót"},{"n":"Ignác","t":"C","i":"/ˈignaːts/","m":"Latin, linked to ignis 'fire'"},{"n":"Illés","t":"C","i":"/ˈilːeːʃ/","m":"Hebrew 'my God is Yahweh'; the Prophet Elijah"},{"n":"Imre","t":"C","i":"/ˈimrɛ/","m":"Germanic Haimirich 'home-ruler'; St Emeric (Imre) of Hungary"},{"n":"István","t":"C","i":"/ˈiʃtvaːn/","m":"Greek stephanos 'crown, wreath'; St Stephen protomartyr and King St Stephen of :"T","i":"/ˈbɛlɛt/","m":"Old French belette 'little beauty'"},{"n":"Bruna","t":"T","i":"/ˈbrunɔ/","m":"Romance/Germanic 'brown'"},{"n":"Dulcia","t":"T","i":"/ˈdultsjɔ/","m":"Latin dulcis 'sweet'; Dulcia of Worms, wife of Eleazar of Worms"},{"n":"Frumet","t":"T","i":"/ˈfrumɛt/","m":"Yiddish 'pious'"},{"n":"Gutta","t":"T","i":"/ˈɡutɔ/","m":"Yiddish/German 'good'"},{"n":"Hendlin","t":"T","i":"/ˈhɛndlin/","m":"Yiddish diminutive of Hanna 'grace'"},{"n":"Jutta","t":"T","i":"/ˈjutɔ/","m":"Yiddish/German form of Judith"},{"n":"Liebel","t":"T","i":"/ˈlibl/","m":"Yiddish 'little beloved'"},{"n":"Minna","t":"T","i":"/ˈminɔ/","m":"Yiddish/German 'love'"},{"n":"Rechel","t":"H","i":"/ˈrɛxl/","m":"Yiddish form of Rachel"},{"n":"Reine","t":"T","i":"/ˈrɛjnɛ/","m":"Yiddish, from French reine 'queen' (for Malka)"},{"n":"Richenza","t":"T","i":"/riˈxɛntsɔ/","m":"Germanic ric 'ruler'; Richenza of Nuremberg"},{"n":"Sheindel","t":"T","i":"/ˈʃɛjndl/","m":"Yiddish 'beautiful'"},{"n":"Gnendel","t":"T","i":"/ˈɡnɛndl/","m":"Yiddish, from German Gnade 'grace' (for Hanna)"},{"n":"Maita","t":"T","i":"/ˈmajtɔ/","m":"Yiddish 'maiden'"},{"n":"Brayna","t":"T","i":"/ˈbrajnɛ/","m":"Yiddish 'brown-haired'"},{"n":"Chaya","t":"H","i":"/ˈxajɛ/","m":"Hebrew 'life'"},{"n":"Dina","t":"H","i":"/ˈdinɛ/","m":"Hebrew 'judged'; daughter of Jacob"},{"n":"Freyde","t":"T","i":"/ˈfrɛjdɛ/","m":"Yiddish 'joy' (for Simcha)"},{"n":"Glikl","t":"T","i":"/ˈɡlikl/","m":"Yiddish 'little luck'"},{"n":"Hinda","t":"T","i":"/ˈhindɛ/","m":"Yiddish 'doe' (for Ayala)"},{"n":"Keyla","t":"T","i":"/ˈkɛjlɛ/","m":"Yiddish, from Kelila 'crown'"},{"n":"Krayne","t":"T","i":"/ˈkrajnɛ/","m":"Yiddish 'crown'"},{"n":"Libe","t":"T","i":"/ˈlibɛ/","m":"Yiddish 'love'"},{"n":"Mirl","t":"T","i":"/mirl/","m":"Yiddish diminutive of Miriam"},{"n":"Pessel","t":"T","i":"/ˈpɛsl/","m":"Yiddish, from Passover or Bathsheba"},{"n":"Reyna","t":"T","i":"/ˈrɛjnɛ/","m":"Yiddish 'pure' or 'queen'"},{"n":"Rikel","t":"T","i":"/ˈrikl/","m":"Yiddish diminutive of Rivka (Rebecca)"},{"n":"Shayne","t":"T","i":"/ˈʃajnɛ/","m":"Yiddish 'beautiful'"},{"n":"Sorl","t":"T","i":"/sɔrl/","m":"Yiddish diminutive of Sarah"},{"n":"Tsirl","t":"T","i":"/tsirl/","m":"Yiddish 'ornament'"},{"n":"Tsvia","t":"H","i":"/ˈtsvijɔ/","m":"Hebrew 'gazelle'"},{"n":"Yudis","t":"H","i":"/ˈjudis/","m":"Hebrew 'woman of Judea, praised'; heroine of the Book of Judith"},{"n":"Zelda","t":"T","i":"/ˈzɛldɛ/","m":"Yiddish 'happy, blessed'"},{"n":"Avigayil","t":"H","i":"/aviˈɡajil/","m":"Hebrew 'father's joy'; Abigail, wife of David"},{"n":"Batsheva","t":"H","i":"/basˈʃɛvɛ/","m":"Hebrew 'daughter of the oath'"},{"n":"Elisheva","t":"H","i":"/ɛliˈʃɛvɛ/","m":"Hebrew Elisheva 'my God is an oath'; St Elizabeth of Hungary"},{"n":"Michal","t":"H","i":"/miˈxal/","m":"Hebrew 'who is like God'; daughter of Saul"},{"n":"Naomi","t":"H","i":"/naˈɔmi/","m":"Hebrew 'pleasant'"},{"n":"Peninah","t":"H","i":"/pɛˈninɔ/","m":"Hebrew 'pearl'"},{"n":"Serach","t":"H","i":"/ˈsɛrax/","m":"Hebrew 'abundance'; daughter of Asher"},{"n":"Shoshanah","t":"H","i":"/ʃɔˈʃanɔ/","m":"Hebrew Shoshannah 'lily'"},{"n":"Yael","t":"H","i":"/jaˈɛl/","m":"Hebrew 'mountain goat'; the heroine Jael"},{"n":"Zilpa","t":"H","i":"/ˈzilpɔ/","m":"Hebrew 'drop'; mother of Gad and Asher"},{"n":"Belaset","t":"T","i":"/bɛlaˈsɛt/","m":"Romance belle assez 'beautiful enough'; Belaset of Lincoln"},{"n":"Licoricia","t":"T","i":"/likɔˈritsjɔ/","m":"Romance 'liquorice, sweet'; Licoricia of Winchester"},{"n":"Floria","t":"T","i":"/ˈflɔrjɔ/","m":"Latin flos 'flower'"},{"n":"Comitissa","t":"T","i":"/kɔmiˈtisɔ/","m":"Latin 'countess'"},{"n":"Mirabel","t":"T","i":"/miraˈbɛl/","m":"Latin mirabilis 'wonderful'"},{"n":"Antera","t":"T","i":"/anˈtɛrɔ/","m":"Old French name of uncertain origin"},{"n":"Pucelle","t":"T","i":"/pyˈsɛl/","m":"Old French 'maiden'"},{"n":"Chera","t":"T","i":"/ˈxɛrɔ/","m":"Hebrew/Romance 'dear'"},{"n":"Gentil","t":"T","i":"/ʒɑ̃ˈtil/","m":"Old French 'noble, kind'"},{"n":"Joia","t":"T","i":"/ˈjɔjɔ/","m":"Romance 'joy'"},{"n":"Elka","t":"T","i":"/ˈɛlkɛ/","m":"Yiddish diminutive of Elisheva"},{"n":"Gnena","t":"T","i":"/ˈɡnɛnɛ/","m":"Yiddish, from German Gnade 'grace'"},{"n":"Perla","t":"T","i":"/ˈpɛrlɔ/","m":"Romance 'pearl'"},{"n":"Yachet","t":"T","i":"/ˈjaxɛt/","m":"Yiddish form of Judith"},{"n":"Yentl","t":"T","i":"/ˈjɛntl/","m":"Diminutive of Yenta"},{"n":"Hodes","t":"T","i":"/ˈhɔdɛs/","m":"Yiddish form of Hadassah 'myrtle'"},{"n":"Tolza","t":"T","i":"/ˈtɔltsɛ/","m":"Yiddish 'sweet' (from Dolce)"},{"n":"Rosa","t":"T","i":"/ˈrɔzɔ/","m":"Romance 'rose'"},{"n":"Bellette","t":"T","i":"/bɛˈlɛt/","m":"Old French 'little beauty'"},{"n":"Muriel","t":"T","i":"/myˈrjɛl/","m":"Old French, perhaps 'myrrh'"},{"n":"Pessia","t":"T","i":"/ˈpɛsjɛ/","m":"Yiddish, from Bathsheba or Passover"},{"n":"Kreindl","t":"T","i":"/ˈkrɛjndl/","m":"Yiddish 'little crown'"},{"n":"Shulamit","t":"H","i":"/ʃulaˈmis/","m":"Hebrew 'peaceful'; the Shulammite of the Song of Songs"},{"n":"Hulda","t":"H","i":"/ˈxuldɔ/","m":"Hebrew 'weasel'; the prophetess Huldah"},{"n":"Adina","t":"H","i":"/aˈdinɔ/","m":"Hebrew 'gentle, delicate'"},{"n":"Ayala","t":"H","i":"/aˈjɔlɔ/","m":"Hebrew 'doe, gazelle'"},{"n":"Bilhah","t":"H","i":"/ˈbilhɔ/","m":"Hebrew 'timid'; mother of Dan and Naphtali"},{"n":"Orah","t":"H","i":"/ˈɔrɔ/","m":"Hebrew 'light'"}]}];
const TAGS = {T:'Traditional',C:'Christian',I:'Islamic',H:'Hebrew'};
const TAG_NOTE = {T:'Native, pre-Christian or secular name',C:'Christian or saint’s name',I:'Arabic or Islamic name',H:'Hebrew or biblical name'};

const $ = s => document.querySelector(s);
const sexSel = $('#sex'), cultSel = $('#culture'), filterIn = $('#filter');
const folio = $('#folio'), list = $('#list'), letters = $('#letters'), count = $('#count'), legend = $('#legend');
const collator = new Intl.Collator('en', {sensitivity:'base'});
let current = [], selected = null, rolling = false;

DATA.forEach((g, i) => {
  const o = document.createElement('option');
  o.value = i; o.textContent = g.label; cultSel.appendChild(o);
});

// remember last choice (per viewer convenience only)
try {
  const s = JSON.parse(localStorage.getItem('mccc-names') || '{}');
  if (s.sex) sexSel.value = s.sex;
  if (s.c != null && DATA[s.c]) cultSel.value = s.c;
} catch (e) {}
function remember(){ try{ localStorage.setItem('mccc-names', JSON.stringify({sex:sexSel.value, c:cultSel.value})) }catch(e){} }

const baseName = n => n.replace(/\s*\(.*\)$/, '');
const alias = n => { const m = n.match(/\((.*)\)$/); return m ? m[1] : ''; };
const headLetter = n => {
  const c = n.normalize('NFD').replace(/[̀-ͯ]/g,'').charAt(0).toUpperCase();
  return /[A-Z]/.test(c) ? c : n.charAt(0).toUpperCase();
};
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  const g = DATA[cultSel.value], sex = sexSel.value;
  current = g[sex].slice().sort((a,b) => collator.compare(a.n, b.n));
  const q = filterIn.value.trim().toLowerCase();
  const strip = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  const sq = strip(q);
  const shown = q ? current.filter(x => strip(x.n).includes(sq) || x.i.toLowerCase().includes(q) || strip(x.i).includes(sq) || strip(x.m).includes(sq)) : current;
  const why = x => (!q || strip(x.n).includes(sq) || strip(x.i).includes(sq) || x.i.toLowerCase().includes(q)) ? '' : ' data-m="1"';
  $('#listtitle').textContent = (sex === 'M' ? 'Male' : 'Female') + ' names';
  count.textContent = q ? `${shown.length} of ${current.length} names` : `${current.length} names`;

  const used = [...new Set(current.map(x => x.t))];
  legend.innerHTML = used.sort().map(t => `<span class="tag ${t}">${TAGS[t]}</span><span class="note">${TAG_NOTE[t]}</span>`).join('');

  const groups = new Map();
  shown.forEach(x => { const L = headLetter(x.n); if (!groups.has(L)) groups.set(L, []); groups.get(L).push(x); });
  letters.innerHTML = [...groups.keys()].map(L => `<a href="#L-${L}">${L}</a>`).join('');
  if (!shown.length){ list.innerHTML = `<p class="none">No ${sex==='M'?'male':'female'} name, pronunciation or meaning contains “${esc(q)}”. Clear the filter to see all ${current.length}.</p>`; return; }
  list.innerHTML = [...groups].map(([L, xs]) =>
    `<div class="group" id="L-${L}"><h3>${L}</h3><ul class="names">` +
    xs.map(x => `<li><button type="button" data-n="${esc(x.n)}"${why(x)} class="${selected && selected.n===x.n ? 'on':''}">` +
      `<span class="n">${esc(baseName(x.n))}</span><span class="i">${esc(x.i)}</span>` +
      `<span class="tag ${x.t}">${TAGS[x.t]}</span></button></li>`).join('') +
    `</ul></div>`).join('');
}

function show(x, scroll){
  selected = x;
  const name = baseName(x.n), al = alias(x.n);
  const first = [...name][0], rest = [...name].slice(1).join('');
  folio.innerHTML =
    `<div class="chosen"><span class="initial" aria-hidden="true">${esc(first)}</span><span class="rest" aria-hidden="true">${esc(rest)}</span></div>` +
    `<span class="sr" style="position:absolute;left:-9999px">${esc(name)}</span>` +
    (al ? `<p class="alias">also ${esc(al)}</p>` : '') +
    `<p class="ipa">${esc(x.i)}</p>` +
    `<div class="meta"><span class="tag ${x.t}">${TAGS[x.t]}</span><span>${DATA[cultSel.value].label}, ${sexSel.value==='M'?'male':'female'}</span></div>` +
    `<p class="meaning">${esc(x.m)}</p>`;
  document.querySelectorAll('.names button.on').forEach(b => b.classList.remove('on'));
  const btn = [...document.querySelectorAll('.names button')].find(b => b.dataset.n === x.n);
  if (btn){ btn.classList.add('on'); if (scroll) btn.scrollIntoView({block:'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto':'smooth'}); }
}

function rollTo(final){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || current.length < 2){ show(final, true); return; }
  rolling = true; folio.classList.add('rolling');
  let step = 0; const steps = 11;
  const tick = () => {
    if (step < steps){
      const r = current[Math.floor(Math.random()*current.length)];
      const nm = [...baseName(r.n)];
      folio.innerHTML = `<div class="chosen"><span class="initial">${esc(nm[0])}</span><span class="rest">${esc(nm.slice(1).join(''))}</span></div>`;
      step++; setTimeout(tick, 35 + step*step*2.2);
    } else {
      folio.classList.remove('rolling'); rolling = false; show(final, true);
    }
  };
  tick();
}

$('#pick').addEventListener('click', () => {
  if (rolling || !current.length) return;
  let x; do { x = current[Math.floor(Math.random()*current.length)]; } while (current.length > 1 && selected && x.n === selected.n);
  if (filterIn.value){ filterIn.value=''; render(); }
  rollTo(x);
});
list.addEventListener('click', e => {
  const b = e.target.closest('button[data-n]'); if (!b) return;
  const x = current.find(y => y.n === b.dataset.n); if (x) show(x, false);
});
function changed(){
  selected = null; filterIn.value = ''; remember(); render();
  folio.innerHTML = '<p class="empty">Press “Pick a random name”, or choose any name from the list.</p>';
}
sexSel.addEventListener('change', changed);
cultSel.addEventListener('change', changed);
filterIn.addEventListener('input', render);

// meaning tooltip on hover / keyboard focus
const tip = document.createElement('div'); tip.id = 'tip'; tip.setAttribute('role','tooltip'); document.body.appendChild(tip);
function tipFor(b){
  const x = current.find(y => y.n === b.dataset.n); if (!x) return;
  const q = filterIn.value.trim();
  let m = esc(x.m);
  if (q){ const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi'); m = m.replace(re, t => `<mark>${t}</mark>`); }
  tip.innerHTML = `<b>${esc(baseName(x.n))}</b>${m}`;
  tip.classList.add('on');
  const r = b.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = Math.min(Math.max(8, r.left + 8), innerWidth - tw - 8);
  let top = r.bottom + 6;
  if (top + th > innerHeight - 8) top = r.top - th - 6;
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
}
const hideTip = () => tip.classList.remove('on');
list.addEventListener('mouseover', e => { const b = e.target.closest('button[data-n]'); if (b) tipFor(b); });
list.addEventListener('mouseout', e => { const b = e.target.closest('button[data-n]'); if (b && !b.contains(e.relatedTarget)) hideTip(); });
list.addEventListener('focusin', e => { const b = e.target.closest('button[data-n]'); if (b) tipFor(b); });
list.addEventListener('focusout', hideTip);
addEventListener('scroll', hideTip, {passive:true});

// keep the sticky offset in step with the controls' real height
const ctrl = document.querySelector('.controls');
const setH = () => document.documentElement.style.setProperty('--ctrl-h', ctrl.offsetHeight + 'px');
new ResizeObserver(setH).observe(ctrl); setH();
render();
</script>
</body>
</html>
